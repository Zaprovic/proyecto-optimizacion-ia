[project]
name = "proyecto-optimizacion-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaprovic", email = "jazaro2001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kmodes>=0.12.2",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
proyecto-optimizacion-ia = "proyecto_optimizacion_ia:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
]
